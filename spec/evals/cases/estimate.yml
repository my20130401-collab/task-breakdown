# 営業「見積もり作成」: 仕入れ先への依頼（返答待ち）を最初に置き、当日中に提出まで終える
label: 営業「見積もり作成」
title: 見積もりを作成する
description: 取引先から今日中に見積もりがほしいと言われた。仕入れ先の価格を確認する必要がある
# 期限は評価を実行した時刻からの相対（m: 分 / h: 時間 / d: 日）
due_in: 8h
expect:
  count:
    min: 3
    max: 8
  # 観点: サブタスクのタイトルにいずれかのキーワードを含めば「ある」とみなす
  aspects:
    - name: 仕入れ先への依頼
      keywords: [依頼, 問い合わせ, 照会]
    - name: 見積書の作成
      keywords: [作成, 作る]
    - name: 見積書の提出
      keywords: [提出, 送付, 送る]
  # 順序: 各列の観点がこの順で現れる（前の観点の手順が、後の観点の手順より前にある）
  order:
    - [仕入れ先への依頼, 見積書の作成, 見積書の提出]
  # 他者の返答待ちになる観点。該当する手順のどれかが kind: special であること
  special: [仕入れ先への依頼]
