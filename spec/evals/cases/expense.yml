# 社内業務「経費申請」: 領収書と勘定科目を先に確かめ、不備の修正時間を見込んで申請する
label: 社内業務「経費申請」
title: 経費申請をする
description: 先週の出張でかかった交通費と宿泊費を精算する。領収書は手元にある
due_in: 3d
expect:
  count:
    min: 3
    max: 8
  aspects:
    - name: 領収書の準備
      keywords: [領収書]
    - name: 勘定科目の確認
      keywords: [勘定科目, 科目, 経費規程, 精算規程]
    - name: 申請内容の入力
      keywords: [入力, 記入, 登録]
    - name: 経費の申請
      keywords: [申請, 提出]
  order:
    - [領収書の準備, 申請内容の入力, 経費の申請]
    - [勘定科目の確認, 経費の申請]
  # 経費申請はベテランの分解でも自分で進められる手順だけで構成されるため、special を求めない
  special: []
