# 社内業務「起案書」: 決裁基準の確認 → 上司の事前相談・承認 → 申請の順で、期限から逆算する
label: 社内業務「起案書」
title: 起案書を作成する
description: 部署で使う新しい業務ツールの導入について起案する。来週の部内会議までに決裁を得たい
due_in: 5d
expect:
  count:
    min: 3
    max: 8
  aspects:
    - name: 決裁基準の確認
      keywords: [決裁基準, 決裁権限, 決裁ルール, 決裁規程]
    - name: 必要書類の準備
      keywords: [書類, 資料]
    - name: 上司の承認
      keywords: [承認, 事前相談, 了承]
    - name: 起案書の申請
      keywords: [申請, 提出, 回付]
  order:
    - [決裁基準の確認, 上司の承認, 起案書の申請]
  special: [上司の承認]
